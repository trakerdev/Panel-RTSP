server {
    listen 80;
    server_name _;

    root /mnt/HDD/cams;
    index index.php index.html;

    # Evitar almacenamiento en caché de imágenes de cámaras
    location ~* \.(jpg|jpeg|png)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # Procesamiento PHP FastCGI
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    # Restringir acceso a archivos y carpetas ocultas
    location ~ /\. {
        deny all;
    }
}
